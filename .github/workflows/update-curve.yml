# Daily automatic update of the US Treasury par yield curve in data.js.
# The Treasury normally publishes the curve by about 6 PM New York time on business days
# (22:00-23:00 UTC, i.e. 06:00-07:00 in Singapore). Three checks run every day; a check that finds
# no new data changes nothing. If any validation fails the job fails, data.js is not changed and
# GitHub sends an email to the repository owner.
name: Update Treasury curve

on:
  schedule:
    - cron: "10 23 * * *"   # 07:10 Singapore
    - cron: "40 0 * * *"    # 08:40 Singapore (retry)
    - cron: "10 4 * * *"    # 12:10 Singapore (retry for late publication)
  workflow_dispatch: {}     # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-curve
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download, verify and apply the Treasury curve
        run: node scripts/update-curve.mjs --commit-message "$RUNNER_TEMP/commit-message.txt"

      - name: Commit and push if data.js changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No change to data.js: nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
